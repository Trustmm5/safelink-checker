<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeLink Checker</title>
<style>
  :root { --bg:#0b0b0f; --card:#16161d; --text:#f2f2f5; --muted:#9a9aa8; --line:#2c2c38; --accent:#b9b4ff; }
  body.light { --bg:#ffffff; --card:#f4f5f8; --text:#15151c; --muted:#5b5b68; --line:#d6d8e0; --accent:#4b44d6; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; justify-content:center; padding:24px 16px; }
  .card { width:100%; max-width:640px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  h1 { margin:0; font-size:1.8rem; }
  .sub { color:var(--muted); margin:6px 0 20px; }
  button { font:inherit; font-weight:600; border-radius:10px; padding:12px 18px; cursor:pointer; border:1px solid var(--line); background:transparent; color:var(--text); }
  .primary { background:var(--accent); color:#111; border:none; }
  textarea { width:100%; min-height:140px; font:inherit; font-size:1rem; padding:14px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--text); resize:vertical; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .result { margin-top:20px; border-radius:12px; border:2px solid; padding:18px; display:none; }
  .result h2 { margin:0 0 4px; font-size:1.6rem; }
  .result ul { margin:10px 0 0; padding-left:20px; line-height:1.6; }
  .tip { margin-top:20px; color:var(--muted); font-size:.95rem; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <h1>SafeLink Checker</h1>
    <button id="themeBtn" title="Switch theme">Light / Dark</button>
  </div>
  <p class="sub">Paste a link or message to check if it looks safe.</p>

  <textarea id="input" placeholder="Paste a link or message here..."></textarea>

  <div class="row">
    <button class="primary" id="checkBtn">Check</button>
    <button id="clearBtn">Clear</button>
    <button id="micBtn" title="Speak">🎤</button>
    <span id="listening" class="sub hidden">Listening...</span>
  </div>

  <div id="result" class="result">
    <h2 id="verdict"></h2>
    <div id="score"></div>
    <ul id="reasons"></ul>
  </div>

  <p class="tip">Safety tip: Never share your OTP, PIN, or password with anyone. Banks never ask for them by link or message.</p>
</div>

<script>
  const $ = id => document.getElementById(id);

  // ---- Theme ----
  if (localStorage.getItem('theme') === 'light') document.body.classList.add('light');
  $('themeBtn').onclick = () => {
    document.body.classList.toggle('light');
    localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
  };

  // ---- Rules ----
  const BRANDS = ['sbi','paypal','amazon','google','apple','microsoft','netflix','hdfc','icici','paytm','phonepe','flipkart','whatsapp','facebook','instagram'];
  const SHORTENERS = ['bit.ly','tinyurl.com','t.co','goo.gl','ow.ly','is.gd','cutt.ly','rebrand.ly'];
  const RISKY_TLDS = ['.xyz','.top','.tk','.zip','.click','.gq','.ml','.cf'];
  const URGENT = ['urgent','immediately','will be blocked','will be suspended','verify now','kyc','last warning','act now','expire today'];
  const SECRETS = ['otp','pin','password','cvv','card number','bank details','account number'];
  const PRIZE = ['you won','lottery','lucky draw','prize','claim your reward','free gift'];

  function analyze(text) {
    const t = text.toLowerCase();
    let score = 0;
    const reasons = [];
    const add = (pts, msg) => { score += pts; reasons.push(msg); };

    const urls = text.match(/(https?:\/\/[^\s]+|www\.[^\s]+|\b[a-z0-9-]+\.(com|in|net|org|xyz|top|tk|zip|click|ml|cf|gq|co)\b[^\s]*)/gi) || [];

    urls.forEach(raw => {
      let host = raw.replace(/^https?:\/\//i, '').replace(/^www\./i, '').split(/[\/?#]/)[0].toLowerCase();
      if (/^\d{1,3}(\.\d{1,3}){3}$/.test(host)) add(25, `The link uses an IP address (${host}) instead of a website name.`);
      if (SHORTENERS.some(s => host === s)) add(15, 'The link is hidden behind a URL shortener, so you cannot see where it goes.');
      if (RISKY_TLDS.some(tld => host.endsWith(tld))) add(15, `The domain ending is often used by scam sites (${host}).`);
      if (host.split('.').length > 4) add(10, 'The link has many subdomains, which scammers use to look official.');
      if (BRANDS.some(b => host.includes(b)) && !BRANDS.some(b => host === b + '.com' || host.endsWith('.' + b + '.com'))) {
        add(30, 'The link uses a well-known brand name, but the address is not the brand\'s official site.');
      }
      if (/[0-9]/.test(host.replace(/\.\w+$/, '')) && BRANDS.some(b => host.replace(/0/g,'o').replace(/1/g,'l').includes(b))) {
        add(20, 'The link looks like a brand name with numbers swapped in (for example "paypa1" or "amaz0n").');
      }
      if (host.includes('-') && BRANDS.some(b => host.includes(b))) add(10, 'The address adds words like "secure" or "login" with dashes to look official.');
    });

    const hits = (list) => list.filter(w => t.includes(w));
    const u = hits(URGENT);
    if (u.length) add(Math.min(20, u.length * 10), 'The message pressures you to act quickly.');
    const s = hits(SECRETS);
    if (s.length) add(30, 'It asks you to share a code, password, or other private details.');
    const p = hits(PRIZE);
    if (p.length) add(15, 'It promises a prize or reward, which is a common scam.');
    if (/block|suspend|close your account|disabled/.test(t)) add(15, 'The message threatens to block or suspend your account.');
    if (/install|download (the )?app|apk/.test(t)) add(15, 'It asks you to install an app, which can give scammers access to your phone.');

    score = Math.min(100, score);
    return { score, reasons };
  }

  // ---- Check ----
  $('checkBtn').onclick = () => {
    const text = $('input').value.trim();
    if (!text) return;
    const { score, reasons } = analyze(text);

    let verdict, color;
    if (score <= 30) { verdict = 'SAFE'; color = '#6fd6a3'; }
    else if (score <= 60) { verdict = 'SUSPICIOUS'; color = '#f5cf6b'; }
    else { verdict = 'DANGEROUS'; color = '#f08a9a'; }

    if (reasons.length === 0) reasons.push('No common scam signs were found. This is not a guarantee, so stay careful.');

    const box = $('result');
    box.style.display = 'block';
    box.style.borderColor = color;
    $('verdict').textContent = verdict;
    $('verdict').style.color = color;
    $('score').textContent = `${score} / 100 risk`;
    $('reasons').innerHTML = reasons.map(r => `<li>${r}</li>`).join('');
  };

  $('clearBtn').onclick = () => { $('input').value = ''; $('result').style.display = 'none'; };

  // ---- Voice input ----
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    $('micBtn').style.display = 'none';
  } else {
    const rec = new SR();
    rec.lang = 'en-IN';
    rec.interimResults = false;
    let listening = false;
    rec.onresult = e => { $('input').value += (e.results[0][0].transcript + ' '); };
    rec.onend = () => { listening = false; $('listening').classList.add('hidden'); };
    $('micBtn').onclick = () => {
      if (listening) { rec.stop(); return; }
      listening = true;
      $('listening').classList.remove('hidden');
      rec.start();
    };
  }
</script>
</body>
</html>
